<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fa" />
  <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('mchive-theme')
        if (saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = saved || 'system'
      } catch (error) {}
    })()
  </script>
  <meta name="description" content="MCHive 面向 Minecraft 服务器服主，提供从零开服路线、服务端与插件教程、配置资料和故障排查指引。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="MCHive — Minecraft 服务器知识平台" />
  <meta property="og:description" content="从零开始搭建好你的 Minecraft 服务器。" />
  <title>MCHive — Minecraft 开服指南、教程与插件资料库</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
