punishment-statistics-broadcast:
  # 是否向全服播报 Vulcan 处罚了多少玩家。
  enabled: false
  # 播报间隔（单位：tick）（默认 18000 tick = 15 分钟）
  interval: 18000
  # 要播报的消息
  broadcast:
    - '&7&m---»--*-------------------------------------*--«---'
    - '&7过去 7 天内，&cVulcan &7共处罚了 &c%amount% &7名玩家。'
    - '&7&m---»--*-------------------------------------*--«---'

# 一些基础设置
settings:
  # 拥有 "vulcan.alerts" 权限的玩家进服时是否自动开启警报
  toggle-alerts-on-join: true
  # %severity% 占位符按单项检查违规值还是玩家总违规值计算
  per-check-severities: true
  # 是否在特定瞄准类检查中检测电影模式（cinematic）。这无关紧要，
  # 保持关闭也没问题，因为除非刻意触发否则几乎永远不会出现。开启后会
  # 拖慢部分检查项的检测速度。
  cinematic: false
  # 这一项只是防止作者发版时忘记删调试消息。如果你在服务器上看到 [Vulcan Debug]，
  # 就把它关掉（正常情况下开或关都不影响你，
  # 但如果你在聊天里看到 [Vulcan Debug]，请把它设为 false 然后重载）。
  debug: true
  # PacketEvents 的设置项，如果你注入遇到问题，我们可能会让你调整它。
  # 如果一切正常，不要动它。
  inject-early: true
  # violations.txt 超过该大小（单位：KB）后会被压缩并移入 logs 文件夹
  max-logs-file-size: 7500
  # 如果你有 Bungee 跨服网络，想给处罚/警报等消息指定具体子服名称
  server-name: 'Default'
  # 警报消息在主线程发送还是异步发送。如果你的服务器接入了 Bungee，
  # 建议保持关闭：警报这类携带大量信息（悬浮文本、点击命令等）的大型聊天组件消息
  # 有时会导致玩家被踢出并提示 "The server you were on has went down" 之类的错误。
  # 简单总结：
  # - BungeeCord 跨服网络：保持 FALSE
  # - 单一服务器：设为 TRUE 可节省一些性能
  async-alerts: false
  enable-api: true
  # 延迟时间（单位：毫秒，1000ms = 1 秒）
  punishment-delay: 10000
  # 是否通过 Floodgate 的 API 自动忽略基岩版玩家。
  ignore-floodgate: true
  # 强烈建议保持 false，因为客户端可以伪造品牌信息；但如果你在用 Geyser
  # 且由于种种原因无法让 Floodgate 正常工作，可以开启此项。如果你的服务器
  # 已装 floodgate-bukkit 且 Geyser 工作正常，不要动它。
  ignore-flags-geyser-client-brand: false
  # 插件完全初始化前等待多久才开始检查玩家（单位：毫秒）。默认
  # 为 2500ms。
  join-check-wait-time: 2500
  # 是否忽略 UUID 以 '000000' 开头的玩家，不对其进行标记 -
  # 用于其他手段都无效时豁免 Geyser 玩家。
  ignore-geyser-uuids: true
  # 是否忽略名字以特定字符/字符串开头的玩家的触发记录
  ignore-geyser-prefixes: true
  # 要忽略的字符串 - 名字以 * 开头的玩家都不会被标记（非符号字符区分大小写）
  ignore-geyser-prefix: "*"
  # 最大违规值（超过此值的警报不再发送）
  max-alert-violation: 250
  # 玩家使用 /fly 后豁免检查多久（默认 40 tick = 2 秒）
  flight-cooldown: 40
  # /vulcan top 命令在数据不足无法排序时显示的内容
  top-command-unresolved: "暂无数据"
  # 审判日队列中的玩家是否还能再次被封禁。
  ignore-if-in-judgement-day: false
  # 是否忽略使用 Vivecraft 加入的玩家。注意这可以被伪造，谨慎开启。
  ignore-vivecraft: false
  # 脚手架是出了名的"坏方块"，是否在部分检查项中对脚手架更宽容。
  lenient-scaffolding: true
  # 是否加载 bStats 统计
  bstats: true
  # 是否处理实体碰撞
  entity-collision: true
  # 如可用，是否与 mcMMO 联动。
  hook-mcmmo: true
  # 如可用，是否与 MythicMobs 联动。
  hook-mythicmobs: true
  # 如可用，是否与 GSit 联动
  hook-gsit: true
  # 如可用，是否与 Brewery 联动
  hook-brewery: true
  # 是否忽略超过最大违规值阈值的警报
  ignore-alerts-over-max-violations: false
  # 超过最大违规值多少才忽略（例如设为 3 表示：若最大违规值
  # 设为 10，则超过 VL 13 的警报都会被忽略）
  ignore-alerts-over-max-violations-amount: 3
  # 当你可能使用了不兼容的 Spigot 分支或插件时，Vulcan 是否发出警告。
  incompatability-manager: true
  # 是否发送插件消息（plugin messaging）
  plugin-messaging: true
  # 当玩家位置低于其上一个着地位置时是否拉回（这可能导致
  # 反虚空效果，如果你的服务器是空岛战争/起床战争类玩法，不太推荐开启）
  dont-setback-lower-positions: false
  # 玩家存在至少多少 tick 后才被检查，与上方 join-check-wait-time 类似
  min-ticks-existed: 3
  # 是否计算玩家与世界边界的距离，以防止 Velocity 类检查误报。
  # 只在非常特殊的服务器上才需要开启。
  velocity-world-border: false
  # 是否处理"海量实体堆在一起把你弹飞"导致的误判。99% 的服务器
  # 都用不到这个选项
  entity-cram-fix-enabled: false
  # 触发统计的实体数量阈值
  entity-cram-entities-amount: 10
  # 遇到上述实体堆叠情况时检查豁免多久
  entity-cram-exempt-ticks: 30
  # 除非我们让你改，否则不要动这个
  dont-register-geyser: false
  # 测试用选项
  testing-stuff: false

  ######################################################################################################################
  # Discord WEBHOOK（网页钩子）配置                                                                                    #
  ######################################################################################################################
discord-webhook:
  # 是否启用冷却限制
  cooldown: false
  # 计数器重置间隔（单位：tick）（默认 12000 tick = 10 分钟，20 tick = 1 秒）
  cooldown-reset-ticks: 12000
  # 上述时间段内允许的最大 Webhook 数量
  cooldown-max-webhooks: 100
  # Discord Webhook 警报配置段
  alerts:
    # 是否启用 Discord Webhook 警报
    enabled: false
    # 在此粘贴你的 Webhook URL。创建 Webhook 的教程见 https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks
    url: 'insert-webhook-url-here'
    # Webhook 的头像
    avatar: 'https://i.imgur.com/JPG1Kwk.png'
    # Webhook 的缩略图
    thumbnail: 'http://cravatar.eu/avatar/%name%/64.png'
    # Webhook 的颜色（可在 https://www.rapidtables.com/web/color/RGB_Color.html 之类的网站上取色）
    color-r: 252
    color-g: 140
    color-b: 3
    # Username of the webhook
    username: 'Vulcan'
    # Title of the webhook
    title: 'Vulcan 警报'
    # Description of the webhook
    description: '**`%player%`** 触发了 %check% %dev%(类型 %type%)%dev% [%vl%/%max-vl%]'
    # content 会在嵌入卡片之外发送纯文本，例如可以用来 @ 身份组或成员。
    content: ''
    information-field: false
    client-version-field: true
    client-brand-field: true
    server-name-field: false
    description-field: false
    location-field: true
    ping-tps-field: true
  punishments:
    # 配置项与说明同上
    enabled: false
    url: 'insert-webhook-url-here'
    avatar: 'https://i.imgur.com/JPG1Kwk.png'
    thumbnail: 'http://cravatar.eu/avatar/%name%/64.png'
    color-r: 255
    color-g: 0
    color-b: 0
    username: 'Vulcan'
    title: 'Vulcan 处罚'
    description: '**`%player%`** 因 %check%（类型 %type%）被处罚 [VL: %vl%]'
    content: ''
    description-field: false
    server-name-field: false
    client-brand-field: false
    client-version-field: false
    ping-tps-field: false
    location-field: false

########################################################################################################################
# 检查项配置。
# enabled: 该检查项启用还是禁用
# punishable: 达到最大违规值时是否执行处罚命令
# broadcast-punishment: 达到最大违规值时是否发送处罚广播（见上方配置）
# max-violations: 最大违规值阈值；达到该值时执行处罚命令（若 punishable 为 true）
# alert-interval: 该检查项警报的发送频率，例如设为 2 表示只在 VL 为 2、4、6、8 时发送警报；
#                 设为 3 则在违规值 3、6、9、12 等时发送。想减少聊天刷屏可以用它。
# dont-alert-until: 只有高于该值的警报才会发送。例如设为 6，
#                   则只有 6 及以上的警报会发送（更低的仍会记入日志，只是不发给管理员）
# maximum-ping: 默认 100000，正常情况下延迟不会高到被 KeepAlive 超时踢出。
#               基本不需要修改：延迟几乎不影响任何检查项，而调低它
#               反而可能被延迟伪造（ping spoof）钻空子。
# minimum-tps: TPS 低于该值时该检查项不生效。
#
# buffer（缓冲区）：
# max: 缓冲区指玩家需要连续"失败"多少次检查项才会真正报警。这基本决定了
#         检查项的灵敏度。建议保持默认；如果你想让反作弊更灵敏或更迟钝，
#         可以小幅调整。不要设得太低或太高，否则要么误报过多，
#         要么完全不报警。
# multiple: 警报发出后缓冲区乘以的系数。例如设为 1 则毫无作用，
#           因为 (1 * x) 就是 x 本身。想让警报来得更慢也可以改它，例如
#           设为 0 表示玩家达到缓冲区上限（如 5）后，缓冲区直接归 0，
#           而不是减半为 2.5（若 multiple 为 0.5 就会是这样）。
# decay: 玩家没有触发检查项时缓冲区的衰减速度。同样，不清楚原理的话
#        别乱动，否则检查项要么完全不报警，要么频繁误报。缓冲区的增长与衰减
#        需要保持平衡比例。所谓平衡是指：衰减设 1、增长设 1 并不平衡，
#        因为玩家只要作弊一个 tick 然后停手就能绕过；
#        反过来，衰减 0.1 对增长 1 就平衡得多：持续作弊的人会不断报警并受罚，
#        而偶尔的小失误会被过滤掉、不会触发警报。
#        filtered out and not alert.
# hotbar-shuffle（快捷栏打乱）：
# enabled: 是否启用该功能。对战斗类（combat）检查项，如果玩家持续触发检查，会打乱
#          其手中的物品栏位。看着作弊者手忙脚乱地搞不清状况相当有趣。
# minimum-vl-to-shuffle: 触发该功能所需的最低违规值。
# shuffle-every: 该功能的执行间隔。
#
# random-rotation（随机视角旋转）：
# enabled: 是否启用该功能。当玩家触发战斗类（combat）检查项时，其视角会被甩向
#          随机方向。同样，观赏性极佳。
# minimum-vl-to-randomly-rotate: 触发该功能所需的最低违规值。
# rotate-every: 该功能的执行间隔。
# 配置有问题？欢迎加入官方 Discord 或私信作者！https://discord.gg/SCNuwUG | frap#0002
