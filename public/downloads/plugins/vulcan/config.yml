##############################################
#      Vulcan 反作弊 配置文件（中文注释版）      #
##############################################
# ─────────────────────────────────────────────────────────────
# 中文注释版说明：本文件基于 Vulcan 2.9.7.23 官方原版 config.yml 完整汉化。
# 仅翻译了注释与玩家可见消息文本，所有配置键、结构与默认值与官方原版
# 完全一致，可直接放入 plugins/Vulcan/ 目录覆盖，执行 /vulcan reload 生效。
# 封禁/踢出理由中的 [Vulcan] Unfair Advantage 已统一译为 [Vulcan] 检测到作弊；
# 各处的 ReadTimeoutException 踢出消息是官方故意伪装成原版超时，请勿翻译。
# ─────────────────────────────────────────────────────────────
# 以下前缀将用于插件中所有带 %prefix% 占位符的消息
prefix: '&4&lVulcan &8»'

alerts:
  # 玩家触发检查项时聊天栏显示的警报格式。
  # 可用占位符：%player%（玩家名）、%max-vl%（最大违规值）、%check%（检查项名称）、%description%（检查项描述）、
  # %version%（玩家客户端版本）、%dev%（* 表示该检查项为实验性）、%vl%（违规值）、
  # %ping%（玩家延迟）、%tps%（服务器 TPS）、%type%（检查项类型字母，A、B、C 等），
  # %severity%（根据违规值变色，选项见下方 severity 配置）、%x%（玩家 X 坐标）、
  # %y%（玩家 Y 坐标）、%z%（玩家 Z 坐标）、%world%（玩家所在世界）、%complex-type%（显示更详细的
  # 检查项名称，例如显示 Speed (Ground) 而不是 Speed (Type B)）
  format: '%prefix% &f%player% &7触发了 &f%check% %dev%&7(&f类型 %type%&7)%dev% &7[&4%vl%&7/&4%max-vl%&7]'
  # 聊天中鼠标悬停警报消息时显示的悬浮文本。
  # 可用占位符与上方 format 相同。
  hover-message:
    - '&7延迟: &c%ping% &8| &7TPS: &c%tps% &8| &7版本: &c%version% &8| &7客户端: &c%client-brand%'
    - ''
    - '&7检查说明：'
    - '&7%description%'
    - ''
    - '&7详细信息：'
    - '&7%info%'
    - ''
    - '&7点击传送到 &b%player%&7。'
  # 点击警报消息时执行的命令。由于每个聊天组件只能绑定一条命令，
  # 插件通过自定义中转命令实现了依次执行任意多条命令的小魔法。
  # 可用占位符：%player%
  click-commands:
    - '/vulcan clickalert %player%'
  # 使用 /vulcan clickalert %player% 时实际执行的命令（必须包含玩家参数）
  click-alert-command-commands:
    - 'tp %player%'
  # 开启警报时发送的消息。可用占位符：%prefix%
  toggled-on-message: '%prefix% &7Vulcan 警报已&a开启&7！'
  # 关闭警报时发送的消息。可用占位符：%prefix%
  toggled-off-message: '%prefix% &7Vulcan 警报已&c关闭&7！'
  # 警报是否同时输出到控制台。
  print-to-console: true
  # 警报输出到控制台时使用的格式
  console-format: '[Vulcan] %player% 触发了 %check% %dev%(类型 %type%)%dev% (%vl%/%max-vl%)'
  # 每当玩家触发检查项时都会执行的命令列表，完全可自定义，方便你在不使用 API 的
  # 情况下对触发行为做一些特殊处理。可用占位符与上方 format 列出的相同。
  # as listed above once again.
  custom-commands: []
  # 你可以在这里按违规值给警报分档配色。
  severity:
    violations:
      2: 4 # 低于此数值的违规将使用下方的颜色 '1'；大于等于此数值且小于 '3' 的使用颜色 '2'
      3: 8 # 大于等于此数值且高于 '2' 的使用下方的颜色 '3'
      4: 12 # 大于等于此数值且高于 '3' 的使用下方的颜色 '4'
      5: 16 # 大于等于此数值且高于 '4' 的使用下方的颜色 '5'
      6: 16 # 大于等于此数值且高于 '5' 的使用下方的颜色 '6'
      7: 16 # 大于等于此数值且高于 '6' 的使用下方的颜色 '7'
      8: 16 # 大于等于此数值且高于 '7' 的使用下方的颜色 '8'
      9: 16 # 大于等于此数值且高于 '8' 的使用下方的颜色 '9'
      10: 16 # 大于等于此数值且高于 '9' 的使用下方的颜色 '10'
    colors: # 这里也支持 HEX 颜色代码（1.16 及以上版本）
      1: '&a' # 该档位使用的颜色，对应上方小于 '2' 的情况
      2: '&e' # 该档位使用的颜色，对应上方大于等于 '2' 且小于 '3' 的情况
      3: '&6' # 该档位使用的颜色，对应上方大于等于 '3' 且小于 '4' 的情况
      4: '&c' # 该档位使用的颜色，对应上方大于等于 '4' 且小于 '5' 的情况
      5: '&4' # 该档位使用的颜色，对应上方大于等于 '5' 且小于 '6' 的情况
      6: '&4' # 该档位使用的颜色，对应上方大于等于 '6' 且小于 '7' 的情况
      7: '&4' # 该档位使用的颜色，对应上方大于等于 '7' 且小于 '8' 的情况
      8: '&4' # 该档位使用的颜色，对应上方大于等于 '8' 且小于 '9' 的情况
      9: '&4' # 该档位使用的颜色，对应上方大于等于 '9' 且小于 '10' 的情况
      10: '&4' # 该档位使用的颜色，对应上方大于等于 '10' 的情况
  # %dev% 占位符显示的符号，用于标记实验性检查项。
  experimental-symbol: "*"

#本段用于配置日志文件（violations.txt）
log-file:
  # 是否启用日志文件
  enabled: true
  # 玩家触发检查项时写入日志的内容。
  # 可用占位符：%player%（玩家名）、%max-vl%（最大违规值）、%check%（检查项名称）、%description%（检查项描述）、
  # %version%（玩家客户端版本）、%dev%（* 表示该检查项为实验性）、%vl%（违规值）、
  # %ping%（玩家延迟）、%tps%（服务器 TPS）、%type%（检查项类型字母，A、B、C 等）。
  alert-message: "%player% 触发了 %check% %dev%(类型 %type%)%dev% [VL: %vl%] [延迟: %ping%] [TPS: %tps%] [版本: %version%] [客户端: %client-brand%]"
  # 玩家因检查项被处罚时写入日志的内容。可用占位符与上方相同。
  # 若已启用（见下一段），处罚的详细信息还会写入 punishments.txt 文件。
  punishment-message: "%player% 因 %check% %dev%(类型 %type%)%dev% 被处罚 [VL: %vl%] [延迟: %ping%] [TPS: %tps%] [客户端: %client-brand%]"

unloaded-chunks:
  # 是否对发送了与未加载区块相等移动数据的玩家执行拉回
  setback-enabled: false
  # 是否提醒管理员，设为 '' 可关闭该消息
  message: '%prefix% &c%player% &7因处于未加载区块被拉回！'
  # 超过多少 tick 后将玩家拉回
  max-ticks: 40

# 本段用于配置 punishments.txt 文件
punishment-file:
  # 是否启用 punishments.txt 文件
  enabled: true

# 本段用于配置违规值自动重置
violation-reset:
  # 是否自动重置违规值
  enabled: true
  # 自动重置违规值的时间间隔（单位：分钟）。
  interval-in-minutes: 8
  # 重置违规值时是否发送消息（仅发送给已开启 /alerts 的管理员）。
  message-enabled: true
  # 重置违规值时发送的消息（仅发送给已开启 /alerts 的管理员）。
  message: '%prefix% &7所有在线玩家的违规值已重置！'

# 本段用于客户端品牌警报与客户端品牌黑名单。
client-brand-alerts:
  # 是否尝试识别玩家的客户端品牌 - 关闭后将完全不注册
  # 对应的消息通道。
  resolve: true
  # 是否启用客户端品牌警报。
  enabled: true
  # 不发送警报的客户端品牌列表。无需完全匹配，例如
  # 'lunar' 即可匹配 'lunarclient' 等。
  ignore-alerts-list:
    - 'vanilla'
  # 玩家加入服务器时发送的消息。可用占位符：%player%（玩家名）、%prefix%（插件前缀）、
  # %client-brand%（玩家的客户端品牌）、%client-version%（玩家的客户端版本）。
  message: '%prefix% &c%player% &7使用 &f%client-brand% &7加入了服务器！'
  # 不允许加入、进服即被踢出的客户端品牌列表。采用字符串包含匹配，
  # 无需完全一致，例如 'forge' 会匹配 Forge，'lunar' 会匹配 lunar 等。
  blocked-client-brands: []
  unallowed-client-brand-kick-message: '&c你不能使用 %client-brand% 加入服务器！'
  # 客户端品牌警报是否同时输出到控制台
  console: false
  # 输出到控制台的消息（需开启上方选项）
  console-message: '[Vulcan] %player% 使用 %client-brand% 加入了服务器！'
  # 是否启用客户端品牌白名单。加入时客户端品牌不在
  # 下方列表中的玩家将无法进入服务器
  whitelist-enabled: false
  # 客户端品牌白名单。采用字符串包含匹配，无需完全一致，例如
  # 'forge' 会匹配 Forge，'lunar' 会匹配 lunar 等。
  whitelisted-client-brands: []

connection:
  debug-messages: false
  ignore-ids-over-0: false
  other-anticheat-support: false
  invalid:
    # 玩家回复了我们从未发送的确认包（不可能发生），将玩家踢出。
    # 除非存在插件不兼容，否则这里绝不应误判。不，你无法禁用它，
    # 我们也不会提供禁用选项——否则玩家可以借此禁用整个插件并
    # 肆意作弊，或导致所有检查全部误报。如有问题请联系官方支持。
    # 下方踢出消息伪装成原版超时异常（ReadTimeoutException），建议保持原样以免暴露反作弊。
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7因发送无效确认包被踢出！（ID: &c%id%&7）'
    console-alert-message: '[Vulcan] &c%player% &7因发送无效确认包被踢出！（ID: &c%id%&7）'
  out-of-order:
    # 玩家以错误的顺序回复确认包，将玩家踢出。卡顿不影响此判定：TCP
    # 本身保证数据包顺序，哪怕你从月球用 500 万延迟游玩也不会误判，
    # 除非存在插件不兼容，或者数据包被其他东西拦截。
    # 不，你无法禁用它，我们也不会提供禁用选项——否则玩家可以借此
    # 禁用整个插件并肆意作弊，或导致所有检查全部误报。如有问题请联系官方支持。
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7因确认包乱序被踢出！(&7收到 &c%id% &7!= 期望 &c%last-id%&7)'
    console-alert-message: '[Vulcan] %player% 因确认包乱序被踢出！(&7收到 &c%id% &7!= 期望 &c%last-id%&7)'
  no-response:
    # 超过 x 秒未回复确认包，将玩家踢出。
    delay-in-seconds: 30
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7因未响应确认包被踢出！(&c%delay%&7ms)'
    console-alert-message: '[Vulcan] %player% 因未响应确认包被踢出！(&c%delay%&7ms)'
    code-of-conduct-fix: true
  max-size:
    # 这表示我们已向玩家发送了 2000 个对方尚未响应的数据包，这……很多了。
    # 如果你服务器上有人频繁因此被踢，多半是其他插件也在发送确认包，
    # 需要把数值调大一点，或者该玩家网络极差/断线了几秒。
    # 需要帮助请联系官方支持。
    amount: 2000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7因待确认包过多被踢出！(&c%size%&7)'
    console-alert-message: '[Vulcan] %player% 因待确认包过多被踢出！(&c%size%&7)'
  keepalive:
    # 长时间未回复 KeepAlive 包，将玩家踢出。
    kick-enabled: true
    max-delay: 45000
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7因长时间未响应 KeepAlive 包被踢出！&7(&c%delay%ms&7)'
    console-message: '[Vulcan] &c%player% &7因长时间未响应 KeepAlive 包被踢出！&7(&c%delay%ms&7)'
  max-ping:
    # 延迟超过设定值并持续指定 tick 数时踢出玩家
    kick-enabled: true
    max-ping: 20000
    max-ticks: 20
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'
    staff-alert-message: '%prefix% &c%player% &7因延迟过高被踢出！&7(&c%ping%ms&7)'
    console-message: '[Vulcan] &c%player% &7因延迟过高被踢出！&7(&c%ping%ms&7)'

# 对已触发过检查项的玩家，临时取消其攻击/伤害
cancel-hits:
  # 对所有检查项启用。保持 false 并在下方手动添加可只对特定检查项生效，添加格式见下方说明。
  enabled-for-all-checks: false
  # 最后一次触发后持续多少毫秒内取消攻击
  duration: 3000
  # 是完全取消攻击事件，还是仅把伤害设为 0。默认不完全取消攻击，而是把伤害设为 0，
  # 让作弊者以为自己仍在造成伤害。设为 true 则完全拦截攻击。
  cancel-event: false
  # 将被取消攻击的检查项列表。格式很宽松，"kill aura a"、"killauraa"、"killaura b"、"jumpb"、"Jump B" 等任何
  # 大小写或写法都可以，只要同时包含检查项名称和类型。例如想阻止锤击（Mace Damage）一击秒杀，
  # 可以把 Jump A + Jump B 都加进来。
  checks: []

# 本段用于配置处罚
punishments:
  # 玩家被处罚时发送的消息（仅发送给已开启 /alerts 的管理员）
  message: '%prefix% &c%player% &7因 &f%check% &7（&f类型 %type%&7） &7[&4x%vl%&7] 被处罚'
  # 玩家被处罚时向全服广播的消息
  broadcast:
    - "&7&m---»--*-------------------------------------*--«---"
    - "&cVulcan &7检测到 &c%player% &7作弊，已将其移出服务器。"
    - "&7&m---»--*-------------------------------------*--«---"

#审判日（Judgement Day）选项
judgement-days:
  # 有人执行 /jday start 后向全服广播的消息
  started-broadcast:
    - "&7&m---»--*-------------------------------------*--«---"
    - "&cVulcan 审判日 v1 已开始……"
    - "&7&m---»--*-------------------------------------*--«---"
  # 审判日结束时向全服广播的消息。
  ended-broadcast:
    - "&7&m---»--*-------------------------------------*--«---"
    - "&c审判日已结束……共处罚了 %amount% 名玩家。"
    - "&7&m---»--*-------------------------------------*--«---"
  # 将要执行的命令，%player% 表示被加入审判日的玩家（/jday add (玩家名)）
  commands:
    - "ban %player% &c[Vulcan] 审判日 v1"
  # 审判日中有人被处罚时向全服广播的消息。
  broadcast:
    - '&7&m---»--*-------------------------------------*--«---'
    - '&c%player% &7已被封禁，理由：&c[Vulcan] 审判日 v1&7。'
    - '&7&m---»--*-------------------------------------*--«---'
  # 审判日队列中两名玩家之间的处理间隔
  cooldown: 1000
  # 是否按固定间隔自动执行审判日（需开启上方选项）
  run-at-interval: false
  # 若开启，此处为执行间隔（单位：tick，20 tick = 1 秒，默认 36000 tick = 30 分钟）
  interval: 36000

freeze:
  # 玩家在被冻结期间退出游戏时执行的命令列表，可自定义
  logged-out-while-frozen-commands: []

# 是否启用幽灵方块修复。玩家会被拉回，周围方块会被重新更新。
ghost-blocks-fix:
  # 是否启用幽灵方块修复。
  enabled: true
  # 是否尝试处理幽灵水方块
  ghost-water-fix: true
  # 低于此 TPS 时该功能不生效，设为 -1 可禁用
  minimum-tps: 18.5
  # 由于 ViaVersion 的设置，是否忽略 1.17 以下客户端版本玩家在 y1 处的幽灵方块
  ignore-legacy-via: true
  # 缓冲区设置
  buffer:
    max: 3
    decay: .1
  # 是否启用幽灵方块拉回。
  setback: true
  # 是否向玩家脚底周围发送方块更新包，重新刷新其脚下方块
  update-blocks: false
  # 悬空多少 tick 后才判定为站在幽灵方块上（默认 3）
  ticks: 3
  # 周围幽灵方块被更新时是否给玩家发送提示消息
  message-enabled: false
  # 玩家站在幽灵方块上时收到的消息（需开启上方选项）
  message: '&c你刚才走在幽灵方块上，方块已为你更新！'
  # 有人因幽灵方块被拉回时是否提醒管理员
  staff-message-enabled: true
  # 玩家因幽灵方块被更新位置时发送给管理员的消息。
  staff-message: '%prefix% &c%player% &7因处于幽灵方块上，位置已被更新！（%world%, %x%, %y%, %z%）&7[%ticks%]'
  # 幽灵方块消息是否同时输出到控制台
  print-to-console: true
  # 若开启，输出到控制台的消息。
  console-message: '%player% 因处于幽灵方块上，位置已被更新！（%world%, %x%, %y%, %z%）&7[%ticks%]'

# 消息选项 - 含义都很直白，不再赘述。
messages:
  no-permission: '&c你没有权限执行这个命令！'
  cant-execute-from-console: '&c你不能在控制台中执行这个命令！'
  ban-command-syntax: '%prefix% &7正确用法：&c/vulcan ban (玩家)&7。'
  kb-command-syntax: '%prefix% &7正确用法：&c/vulcan knockback (玩家) &8| &c/vulcan kb (玩家)&7。'
  profile-command-syntax: '%prefix% &7正确用法：&c/vulcan profile (玩家)&7。'
  jday-command-syntax: '%prefix% &7正确用法：&c/jday add (玩家) &8| &c/jday execute &8| &c/jday list &8| &c/jday remove (玩家)&7。'
  reload-success: '%prefix% &aVulcan 重载成功！'
  invalid-target: '%prefix% &c找不到指定的玩家！'
  kb-test-success: '%prefix% &a已成功对 %player% 执行击退测试！'
  jday-no-pending-bans: '%prefix% &c当前没有待处理的封禁！'
  jday-added-to-list: '%prefix% &c%player% &7已成功加入列表！'
  reset-command: '%prefix% &7所有在线玩家的违规值已重置！'
  disable-check-command-syntax: '%prefix% &c正确用法：/vulcan disablecheck (检查名) - 区分大小写。'
  invalid-check: '%prefix% &c无效的检查名！示例：AimA、BadPacketsF、AutoClickerJ。'
  removed-check: '%prefix% &c已禁用检查 %check%！'
