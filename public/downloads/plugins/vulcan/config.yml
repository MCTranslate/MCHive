# 命令配置项。
commands:
  # Vulcan help 命令的输出内容。
  help:
    - "&7&m---»--*-------------------------------------*--«---"
    - "&cVulcan 作弊检测 v%version% 作者：&cfrep (.frap)"
    - "&r"
    - "&c/vulcan help &8- &7打开此帮助菜单"
    - "&c/vulcan profile &8 - &7查看玩家的 Vulcan 档案。"
    - "&c/vulcan ban (玩家) &8- &7通过 Vulcan 封禁一名玩家。"
    - "&c/vulcan reload &8- &7重载所有文件。"
    - "&c/vulcan disablecheck (检查名) &8- &7禁用一项检查（区分大小写）。"
    - "&c/vulcan violations (玩家) &8- &7查看指定玩家的全部违规值。"
    - "&c/vulcan cps (玩家) &8- &7显示玩家的 CPS（每秒点击数）。"
    - "&c/vulcan kb (玩家) &8 | &c/vulcan knockback (玩家) &8- &7对玩家施加击退。"
    - "&c/vulcan connection (玩家) &8- &7查看玩家的连接信息。"
    - "&c/vulcan freeze (玩家) &8- &7冻结/解冻一名玩家。"
    - "&c/vulcan rotate (玩家) &8- &7随机旋转玩家的视角（yaw/pitch）。"
    - "&c/vulcan shuffle (玩家) &8- &7随机打乱玩家的快捷栏槽位。"
    - "&c/vulcan top &8- &7显示各类别违规值最高的玩家。"
    - "&c/vulcan testalert &8- &7测试 Discord Webhook 联动。"
    - "&r"
    - "&c/jday add (玩家) &8- &7将玩家加入审判日。"
    - "&c/jday execute &8- &7执行一次审判日。"
    - ""
    - "&c/alerts &8- &7开关作弊警报。"
    - ""
    - "&c/logs (玩家) (页码) &8- &7查看玩家的违规记录。"
    - "&c/punishlogs (玩家) &8- &7查看玩家的处罚记录。"
    - "&7&m---»--*-------------------------------------*--«---"
  ban:
    # 执行 /vulcan ban (玩家) 时将执行的命令
    commands:
      - 'ban %player% &c[Vulcan] 检测到作弊'
    # 执行 /vulcan ban (玩家) 时向全服广播的消息
    broadcast:
      - "&7&m---»--*-------------------------------------*--«---"
      - "&cVulcan &7检测到 &c%player% &7作弊，已将其移出服务器。"
      - "&7&m---»--*-------------------------------------*--«---"
  # /vulcan profile (玩家名) 命令的显示选项
  profile:
    - "&7&m---»--*-------------------------------------*--«---"
